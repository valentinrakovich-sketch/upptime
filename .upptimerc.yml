owner: valentinrakovich-sketch
repo: upptime

sites:
  - name: specialty.ru
    url: https://specialty.ru/robots.txt
    # robots.txt отдаёт nginx без Битрикса: не создаёт гостей в статистике и сессий
  - name: aremde.ru
    url: https://aremde.ru/
  - name: brand-rise.ru
    url: https://brand-rise.ru/
  - name: wigomat.pro
    url: https://wigomat.pro/
    # сайт пока закрыт паролем: 401 = сервер жив
    expectedStatusCodes:
      - 200
      - 401

status-website:
  baseUrl: /upptime
  name: Статус сайтов Спешалти
  introTitle: "Доступность сайтов компании"
  introMessage: Проверка каждые 5 минут через GitHub Actions.
  navbar:
    - title: Статус
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Уведомления в Telegram включаются секретами репозитория:
# NOTIFICATION_TELEGRAM=true, NOTIFICATION_TELEGRAM_BOT_KEY, NOTIFICATION_TELEGRAM_CHAT_ID
# Настройки: https://upptime.js.org/docs/configuration
